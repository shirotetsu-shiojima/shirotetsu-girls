<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>白鉄ガールズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Murecho&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdeaff; --card:#fff; --ink:#3b1647; --sub:#8a5a99;
  --p1:#ff4fe0; --p2:#c63cff; --edge:#b100c8; --line:#f0c8f7; --soft:#f6e0ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;}
header{background:#fff;border-bottom:3px solid var(--p2);position:sticky;top:0;z-index:5}
.hwrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px 24px;padding:8px 16px;flex-wrap:wrap}
.logo{height:64px;width:auto;display:block;flex:none;overflow:visible}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 16px;border-radius:999px;text-decoration:none;color:var(--p2);font-weight:600;font-size:14px;border:1px solid transparent}
nav a:hover{background:var(--soft)}
nav a.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:var(--edge)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2.sec{font-size:18px;margin:24px 0 10px;padding-left:10px;border-left:5px solid var(--p2)}
h2.sec:first-child{margin-top:4px}
.note{font-size:12px;color:var(--sub)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.controls input,.controls select,select.sm{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
.controls input{flex:1;min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.chips .lb{font-size:12px;color:var(--sub);width:40px}
.chip{border:1px solid var(--p2);color:var(--p2);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:var(--edge)}
.count{font-size:13px;color:var(--sub);margin:6px 0 12px}
.grid{--cw:200px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:14px}
.grid[data-size=s]{--cw:170px}.grid[data-size=m]{--cw:250px}.grid[data-size=l]{--cw:340px}
@media(max-width:560px){.grid{--cw:150px;gap:10px}.grid[data-size=s]{--cw:105px}.grid[data-size=m]{--cw:150px}.grid[data-size=l]{--cw:100%}}
.dhead .photo img{cursor:zoom-in}
#lb{max-width:min(92vw,720px);background:transparent;box-shadow:none;overflow:visible}
#lb img{width:100%;max-height:90vh;object-fit:contain;border-radius:12px;display:block;cursor:zoom-out;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s;position:relative}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 6px 16px rgba(177,0,200,.2);outline:none}
.photo{aspect-ratio:3/4;background:linear-gradient(160deg,#ffd3f7,#e2b6ff);display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;font-weight:700;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.no{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);color:var(--edge);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.info{padding:8px 10px 10px}
.name{font-weight:700;font-size:15px}
.yomi{font-size:11px;color:var(--sub);margin-bottom:6px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--edge)}
.score{margin-top:6px;font-size:12px;color:var(--sub)}
.score b{color:var(--edge);font-size:14px}
.badge{position:absolute;right:8px;top:8px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
/* panels */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 a{font-size:12px;color:var(--p2);text-decoration:none;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.tile .k{font-size:12px;color:var(--sub)}
.tile .v{font-size:26px;font-weight:700;color:var(--edge);line-height:1.3}
.tile .v small{font-size:13px;color:var(--sub);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;border-radius:8px}
.row:hover{background:#fbf0ff}
.thumb{width:36px;height:36px;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#ffd3f7,#e2b6ff);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.thumb img{width:100%;height:100%;object-fit:cover}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:11px;color:var(--sub)}
.row .r{font-size:13px;color:var(--edge);font-weight:700;white-space:nowrap}
.empty{color:var(--sub);font-size:13px;padding:6px 0}
.pick{display:flex;gap:14px;align-items:center;cursor:pointer}
.pick .photo{width:96px;flex:none;border-radius:12px;font-size:40px}
.facing{display:flex;flex-wrap:wrap;gap:6px}
/* bars */
.hb{display:grid;grid-template-columns:90px 1fr 56px;gap:8px;align-items:center;font-size:12px;margin:4px 0}
.hb .lb{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb i{display:block;height:12px;background:#f3dcfb;border-radius:6px;overflow:hidden}
.hb i b{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2))}
.hb .v{text-align:right;color:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.col .bar{width:100%;max-width:38px;background:linear-gradient(180deg,var(--p1),var(--p2));border-radius:4px 4px 0 0;min-height:1px}
.col .n{font-size:11px;color:var(--ink);margin-bottom:2px}
.collb{display:flex;gap:4px}
.collb span{flex:1;text-align:center;font-size:10px;color:var(--sub);margin-top:3px;min-width:0;white-space:nowrap;overflow:hidden}
.scroll{overflow-x:auto}
table.heat{border-collapse:collapse;font-size:12px;width:100%;min-width:560px}
table.heat th,table.heat td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.heat th:first-child,table.heat td:first-child{text-align:left;white-space:nowrap}
table.heat th{color:var(--sub);font-weight:600}
.ins{margin:0;padding-left:18px;font-size:14px;line-height:1.9}
.scatter circle{cursor:pointer;transition:r .1s}
.scatter circle:hover{r:7}
/* birthday */
.today{background:linear-gradient(135deg,#ffe1fa,#ecd0ff);border:2px solid var(--p2);border-radius:16px;padding:14px 16px}
/* dialog */
dialog{border:none;border-radius:18px;padding:0;max-width:720px;width:calc(100% - 24px);color:var(--ink)}
dialog::backdrop{background:rgba(60,0,80,.45)}
.dhead{display:flex;gap:16px;padding:18px;background:linear-gradient(135deg,#ffe1fa,#ecd0ff)}
.dhead .photo{width:200px;flex:none;border-radius:12px}
.dhead h2{margin:0;font-size:22px}
.dclose{position:absolute;right:10px;top:8px;border:none;background:#fff;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--edge)}
.dbody{padding:16px 18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.dbody{grid-template-columns:1fr}.dhead{flex-direction:column;align-items:center;text-align:center}.dhead .photo{width:min(240px,70%)}.logo{height:52px}}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
dt{color:var(--sub)}dd{margin:0}
.bars{margin-top:10px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.bar span:first-child{width:52px;color:var(--sub)}
.bar i{flex:1;height:8px;background:#f3dcfb;border-radius:4px;overflow:hidden}
.bar i b{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2))}
.bar span:last-child{width:46px;text-align:right}
.msg{padding:40px;text-align:center;color:var(--sub);line-height:1.8}
footer{text-align:center;font-size:12px;color:var(--sub);padding:24px}

/* hero */
.hero{position:relative;height:340px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#ffd3f7,#d9a8ff);margin-bottom:18px;box-shadow:0 6px 20px rgba(177,0,200,.18)}
.hero.loading{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.slide{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:space-between;opacity:0;transition:opacity .8s;cursor:pointer;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.sbg{position:absolute;inset:-24px;background-size:cover;background-position:center top;filter:blur(24px) saturate(1.1);opacity:.6}
.slide::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(255,240,255,.93) 0%,rgba(255,240,255,.6) 45%,rgba(255,240,255,0) 78%)}
.stext{position:relative;z-index:2;padding:32px 40px;align-self:center;max-width:58%}
.slabel{font-size:12px;letter-spacing:.12em;color:var(--edge);font-weight:700}
.sname{font-size:34px;font-weight:700;line-height:1.25;margin:4px 0 2px}
.syomi{font-size:13px;color:var(--sub);margin-bottom:10px}
.sscore{margin-top:10px;font-size:14px;color:var(--sub)}
.sscore b{color:var(--edge);font-size:20px}
.sphoto{position:relative;z-index:2;height:88%;aspect-ratio:3/4;align-self:center;margin-right:7%;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(80,0,100,.3)}
.sphoto img{width:100%;height:100%;object-fit:cover;display:block}
.hnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.88);color:var(--edge);font-size:22px;line-height:1;cursor:pointer}
.hnav.prev{left:10px}.hnav.next{right:10px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:3;flex-wrap:wrap;padding:0 56px}
.dot{width:8px;height:8px;border-radius:4px;border:none;padding:0;background:rgba(177,0,200,.3);cursor:pointer;transition:width .25s}
.dot.on{background:var(--edge);width:22px}
@media(max-width:560px){.hero{height:300px}.sname{font-size:22px}.stext{padding:20px 16px 20px 20px;max-width:56%}.sphoto{height:80%;margin-right:12px}.hnav{display:none}}
</style>
</head>

<script>
(function(){
  const s=document.querySelector('svg.logo'); if(!s) return;
  const fit=()=>{ try{ const b=s.getBBox(); if(b.width>0) s.setAttribute('viewBox',`${b.x-4} ${b.y-4} ${b.width+8} ${b.height+8}`); }catch(e){} };
  fit(); if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
const CSV_FILE = '白鉄ガールズデータ - メンバー一覧.csv';
const STATS = ['体力','パワー','ガード','コミュ力','学力'];
const STAT_MAX = 10000;   // 五角形・バーの上限（超えた値は上限位置に表示）
const $ = s => document.querySelector(s);
const fmt = n => n==null ? '—' : Number(n).toLocaleString('ja-JP',{maximumFractionDigits:1});
const avg = a => { a=a.filter(v=>v!=null); return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; };
const pad2 = n => String(n).padStart(2,'0');
let members = [], byNo = {};

/* ---------- 日付 ---------- */
const NOW = new Date();
const TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
function bInfo(m){
  if(!m.bm) return null;
  let d = new Date(TODAY.getFullYear(), m.bm-1, m.bd);
  if(d < TODAY) d = new Date(TODAY.getFullYear()+1, m.bm-1, m.bd);
  const days = Math.round((d - TODAY)/864e5);
  const turning = d.getFullYear() - m.by;
  return {days, turning, date:d};
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text = text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"') q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cur);cur='';
      if(row.some(v=>v!==''))rows.push(row);
      row=[];
    } else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const num = v => { const n=parseFloat(v); return isNaN(n)?null:n; };
function imgUrl(u){
  if(!u) return '';
  const m = u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);
  return m ? `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}/${m[4]}` : u;
}
function buildMembers(rows){
  const head = rows[0];
  const ALIAS = {'身長':['身長','新帳']};
  const idx = n => { for(const k of (ALIAS[n]||[n])){ const i=head.indexOf(k); if(i>=0) return i; } return -1; };
  return rows.slice(1).map(r=>{
    const g = n => (r[idx(n)]||'').trim();
    const h=num(g('身長')), w=num(g('体重'));
    const bd=g('誕生日').match(/(\d+)月(\d+)日/);
    const m = {
      no:num(g('番号')), term:g('期'), termNo:parseInt(g('期'))||0,
      origin:g('出所'), world:g('世界'),
      name:g('名前'), yomi:g('読み').replace(/　/g,' '),
      start:g('活動開始'), by:parseInt(g('生まれ年'))||null,
      bm:bd?+bd[1]:null, bd:bd?+bd[2]:null,
      height:h, weight:w, bmi:(h&&w)?+(w/((h/100)**2)).toFixed(1):null,
      stats:STATS.map(c=>num(g(c))), total:num(g('5項目計')),
      iq:num(g('IQ')), rating:num(g('評価値')), ability:num(g('能力評価値')),
      img:imgUrl(g('画像URL')), orig:g('画像URL')
    };
    const b=bInfo(m);
    m.age = b ? (b.days===0 ? b.turning : b.turning-1) : null;
    return m;
  }).filter(m=>m.name);
}

/* ---------- 指標 ---------- */
const METRICS = {
  '評価値':m=>m.rating, '能力評価値':m=>m.ability, 'IQ':m=>m.iq,
  '体力':m=>m.stats[0], 'パワー':m=>m.stats[1], 'ガード':m=>m.stats[2], 'コミュ力':m=>m.stats[3], '学力':m=>m.stats[4],
  '5項目計':m=>m.total, '年齢':m=>m.age, '身長':m=>m.height, '体重':m=>m.weight, 'BMI':m=>m.bmi
};
function pearson(pts){
  const n=pts.length; if(n<3) return null;
  const mx=avg(pts.map(p=>p.x)), my=avg(pts.map(p=>p.y));
  let sxy=0,sxx=0,syy=0;
  pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2;syy+=(p.y-my)**2;});
  return sxx&&syy ? sxy/Math.sqrt(sxx*syy) : null;
}

/* ---------- 共通パーツ ---------- */
function imgFail(img, ch){
  if(!img.dataset.alt && img.dataset.orig){
    img.dataset.alt='1';
    img.src = img.dataset.orig + (img.dataset.orig.includes('?')?'&':'?') + 'raw=true';
  } else img.parentNode.textContent = ch;
}
const initial = m => m.name.replace(/\s/g,'')[0]||'?';
function photoInner(m){
  return m.img ? `<img src="${m.img}" data-orig="${m.orig}" alt="${m.name}" loading="lazy" onerror="imgFail(this,'${initial(m)}')">` : initial(m);
}
const photoHTML = m => `<div class="photo">${photoInner(m)}</div>`;
const thumbHTML = m => `<span class="thumb">${photoInner(m)}</span>`;
const noLabel = m => `No.${pad2(m.no)}`;
function personRow(m, right, sub){
  return `<div class="row" data-no="${m.no}">${thumbHTML(m)}<div class="t"><b>${m.name}</b><span>${sub||`${m.term} / ${m.origin}`}</span></div><div class="r">${right||''}</div></div>`;
}
function card(m, extra, scoreHTML){

function hbars(items, {max, f=fmt}={}){
  max = max ?? Math.max(...items.map(i=>i.value||0), 1);
  return items.map(i=>`<div class="hb"><span class="lb" title="${i.label}">${i.label}</span><i><b style="width:${Math.min(100,Math.max(0,(i.value||0)/max*100))}%"></b></i><span class="v">${f(i.value)}</span></div>`).join('');
}
function columns(items, {f=fmt}={}){
  const max=Math.max(...items.map(i=>i.value||0),1);
  return `<div class="cols">${items.map(i=>`<div class="col" title="${i.label}: ${f(i.value)}"><span class="n">${i.value?f(i.value):''}</span><div class="bar" style="height:${(i.value||0)/max*100*0.82}%"></div></div>`).join('')}</div>
  <div class="collb">${items.map(i=>`<span>${i.label}</span>`).join('')}</div>`;
}
function countBy(list, keyFn){
  const mp=new Map();
  list.forEach(m=>{const k=keyFn(m); if(k!=null&&k!=='') mp.set(k,(mp.get(k)||0)+1);});
  return mp;
}

function rankOf(m, fn){
  const vals=members.map(fn).filter(v=>v!=null).sort((a,b)=>b-a);
  const v=fn(m); return v==null?null:vals.indexOf(v)+1;
}
function radar(stats){
  const cx=100, cy=100, R=70, n=stats.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let s='<svg viewBox="0 0 200 200" width="100%">';
  [0.25,0.5,0.75,1].forEach(k=>{ s+=`<polygon points="${stats.map((_,i)=>pt(i,R*k).join(',')).join(' ')}" fill="none" stroke="#f0c8f7"/>`; });
  stats.forEach((_,i)=>{const [x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#f0c8f7"/>`;});
  s+=`<polygon points="${stats.map((v,i)=>pt(i,R*Math.min(1,(v||0)/STAT_MAX)).join(',')).join(' ')}" fill="rgba(198,60,255,.35)" stroke="#b100c8" stroke-width="2"/>`;
  STATS.forEach((c,i)=>{const [x,y]=pt(i,R+16);s+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="#8a5a99">${c}</text>`;});
  return s+'</svg>';
}
function openDetail(m){

/* ---- ヒーロー（自動スライド） ---- */
let HERO_T = null;
function loadImg(m){
  return new Promise(res=>{
    const attempt = (u, next) => {
      let done=false; const i=new Image();
      const fin = ok => { if(done) return; done=true; clearTimeout(to); ok ? res(u) : next(); };
      const to = setTimeout(()=>fin(false), 8000);
      i.onload=()=>fin(true); i.onerror=()=>fin(false); i.src=u;
    };
    attempt(m.img, ()=>attempt(m.orig+(m.orig.includes('?')?'&':'?')+'raw=true', ()=>res(null)));
  });
}
function seededRandom(seed){            // mulberry32：同じ日付なら同じ並びになる
  let a=seed>>>0;
  return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
}
function shuffled(arr,rnd){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
async function pickLoadable(pool,n){      // 先頭から順に読み込み、表示できた人をn人まで採用
  const out=[]; let i=0;
  while(out.length<n && i<pool.length){
    const batch=pool.slice(i,i+(n-out.length)); i+=batch.length;
    const urls=await Promise.all(batch.map(loadImg));
    batch.forEach((m,k)=>{ if(urls[k]) out.push({m,u:urls[k]}); });
  }
  return out;
}
async function initHero(){
  clearInterval(HERO_T);
  const box=$('#hero'); if(!box) return;
  // 日替わり5枠: 1枠目はSTAFF、残り4枠はSTAFF以外から（画像のあるメンバーが対象）
  const rnd=seededRandom(TODAY.getFullYear()*10000+(TODAY.getMonth()+1)*100+TODAY.getDate());
  const withImg=members.filter(m=>m.img);
  const staffPool=shuffled(withImg.filter(m=>m.origin==='STAFF'),rnd);
  const otherPool=shuffled(withImg.filter(m=>m.origin!=='STAFF'),rnd);
  const [staffPick,otherPick]=await Promise.all([pickLoadable(staffPool,1),pickLoadable(otherPool,4)]);
  if($('#hero')!==box) return;           // 読み込み中に画面が切り替わった
  const list=[...staffPick,...otherPick];
  if(!list.length){ box.style.display='none'; return; }
  box.className='hero';
  box.innerHTML=`${list.map((x,i)=>`<div class="slide${i?'':' on'}" data-no="${x.m.no}">
      <div class="sbg" style="background-image:url('${x.u}')"></div>
      <div class="stext"><div class="slabel">${noLabel(x.m)}</div><div class="sname">${x.m.name}</div><div class="syomi">${x.m.yomi}</div>
        <div class="tags"><span class="tag">${x.m.term}</span><span class="tag">${x.m.origin}</span><span class="tag">${x.m.world}</span></div>
        <div class="sscore">評価値 <b>${fmt(x.m.rating)}</b></div></div>
      <div class="sphoto"><img src="${x.u}" alt="${x.m.name}"></div></div>`).join('')}
    <button class="hnav prev" aria-label="前へ">‹</button><button class="hnav next" aria-label="次へ">›</button>
    <div class="dots">${list.map((_,i)=>`<button class="dot${i?'':' on'}" data-i="${i}" aria-label="${i+1}枚目"></button>`).join('')}</div>`;
  const slides=[...box.querySelectorAll('.slide')], dots=[...box.querySelectorAll('.dot')];
  let idx=0;
  const show=i=>{ idx=(i+slides.length)%slides.length; slides.forEach((s,k)=>s.classList.toggle('on',k===idx)); dots.forEach((d,k)=>d.classList.toggle('on',k===idx)); };
  const stop=()=>clearInterval(HERO_T);
  const play=()=>{
    stop();
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    HERO_T=setInterval(()=>{ if($('#hero')!==box){stop();return;} show(idx+1); }, 5000);
  };
  box.querySelector('.prev').onclick=()=>{show(idx-1);play();};
  box.querySelector('.next').onclick=()=>{show(idx+1);play();};
  dots.forEach(d=>d.onclick=()=>{show(+d.dataset.i);play();});
  box.onmouseenter=stop; box.onmouseleave=play;
  let sx=null;
  box.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;stop();},{passive:true});
  box.addEventListener('touchend',e=>{ if(sx!=null){const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) show(idx+(dx<0?1:-1));} sx=null; play(); });
  play();
}

/* =============== 統計 =============== */
const S = {gdim:'出所', sx:'IQ', sy:'評価値'};
function scatterSVG(xk, yk){
  const pts = members.map(m=>({m,x:METRICS[xk](m),y:METRICS[yk](m)})).filter(p=>p.x!=null&&p.y!=null);
  if(pts.length<2) return '<div class="empty">データが足りません</div>';
  const W=640,H=400,L=64,R=16,T=14,B=44;
  const ext = vals => { let lo=Math.min(...vals), hi=Math.max(...vals); if(lo===hi){lo-=1;hi+=1;} const pd=(hi-lo)*.06; return [lo-pd,hi+pd]; };
  const [x0,x1]=ext(pts.map(p=>p.x)), [y0,y1]=ext(pts.map(p=>p.y));
  const sx=v=>L+(v-x0)/(x1-x0)*(W-L-R), sy=v=>H-B-(v-y0)/(y1-y0)*(H-B-T);
  const r = pearson(pts);
  let line='';
  if(r!=null){
    const mx=avg(pts.map(p=>p.x)), my=avg(pts.map(p=>p.y));
    const sxx=pts.reduce((a,p)=>a+(p.x-mx)**2,0), sxy=pts.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0);
    const k=sxy/sxx, c=my-k*mx;
    line=`<line x1="${sx(x0)}" y1="${sy(k*x0+c)}" x2="${sx(x1)}" y2="${sy(k*x1+c)}" stroke="#b100c8" stroke-width="2" stroke-dasharray="6 4" clip-path="url(#clip)"/>`;
  }
  let g='';
  for(let i=0;i<=4;i++){
    const xv=x0+(x1-x0)*i/4, yv=y0+(y1-y0)*i/4;
    g+=`<line x1="${sx(xv)}" y1="${T}" x2="${sx(xv)}" y2="${H-B}" stroke="#f3dcfb"/><text x="${sx(xv)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="#8a5a99">${fmt(Math.round(xv*10)/10)}</text>`;
    g+=`<line x1="${L}" y1="${sy(yv)}" x2="${W-R}" y2="${sy(yv)}" stroke="#f3dcfb"/><text x="${L-6}" y="${sy(yv)+4}" text-anchor="end" font-size="11" fill="#8a5a99">${fmt(Math.round(yv*10)/10)}</text>`;
  }
  const dots = pts.map(p=>`<circle data-no="${p.m.no}" cx="${sx(p.x)}" cy="${sy(p.y)}" r="5" fill="rgba(198,60,255,.6)" stroke="#b100c8"><title>${p.m.name}（${xk} ${fmt(p.x)} / ${yk} ${fmt(p.y)}）</title></circle>`).join('');
  const rtxt = r==null ? '相関を計算できません' : `相関係数 r = ${r.toFixed(2)}（${Math.abs(r)>=.7?'強い':Math.abs(r)>=.4?'中程度の':Math.abs(r)>=.2?'弱い':'ほぼ無い'}${r>=0?'正':'負'}${Math.abs(r)<.2?'':'の相関'}）・${pts.length}人`;
  return `<div class="note" style="margin-bottom:6px">${rtxt}　点をタップで詳細</div>
    <svg class="scatter" viewBox="0 0 ${W} ${H}" width="100%"><defs><clipPath id="clip"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-B-T}"/></clipPath></defs>
    ${g}${line}${dots}
    <text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="#3b1647">${xk}</text>
    <text transform="translate(14,${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#3b1647">${yk}</text></svg>`;
}
function groupTable(dim){
  const key = m => dim==='期'?m.term : dim==='出所'?m.origin : m.world;
  const mp = new Map();
  members.forEach(m=>{ const k=key(m); if(!mp.has(k)) mp.set(k,[]); mp.get(k).push(m); });
  let groups=[...mp.entries()];
  groups = dim==='期' ? groups.sort((a,b)=>parseInt(a[0])-parseInt(b[0])) : groups.sort((a,b)=>b[1].length-a[1].length);
  const cols = ['評価値','能力評価値','IQ',...STATS];
  const data = groups.map(([k,list])=>({k,n:list.length,v:cols.map(c=>avg(list.map(METRICS[c])))}));
  const rng = cols.map((_,i)=>{ const a=data.map(d=>d.v[i]).filter(v=>v!=null); return [Math.min(...a),Math.max(...a)]; });
  const bars = hbars(data.map(d=>({label:`${d.k}（${d.n}人）`,value:d.v[0]})));
  const table = `<div class="scroll"><table class="heat"><tr><th>${dim}</th><th>人数</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>
    ${data.map(d=>`<tr><td>${d.k}</td><td>${d.n}</td>${d.v.map((v,i)=>{
      const [lo,hi]=rng[i]; const t=hi>lo?(v-lo)/(hi-lo):.5;
      return `<td style="background:rgba(198,60,255,${(.06+.5*t).toFixed(2)})">${fmt(Math.round(v))}</td>`; }).join('')}</tr>`).join('')}</table></div>`;
  return {bars, table};
}
function insights(){
  const L=[];
  const byRating=[...members].filter(m=>m.rating!=null).sort((a,b)=>b.rating-a.rating);
  L.push(`評価値が最も高いのは <b>${byRating[0].name}</b>（${fmt(byRating[0].rating)}）です。`);
  const og=new Map(); members.forEach(m=>{ if(!og.has(m.origin)) og.set(m.origin,[]); og.get(m.origin).push(m); });
  const ranked=[...og.entries()].filter(([,l])=>l.length>=2).map(([k,l])=>[k,avg(l.map(m=>m.rating)),l.length]).sort((a,b)=>b[1]-a[1]);
  if(ranked.length) L.push(`2人以上いる出所のうち、平均評価値が最も高いのは <b>${ranked[0][0]}</b>（平均 ${fmt(Math.round(ranked[0][1]))}・${ranked[0][2]}人）です。`);
  const iqR=pearson(members.filter(m=>m.iq!=null&&m.rating!=null).map(m=>({x:m.iq,y:m.rating})));
  if(iqR!=null) L.push(`IQ と評価値の相関係数は <b>${iqR.toFixed(2)}</b> です。`);
  const aged=members.filter(m=>m.age!=null).sort((a,b)=>a.age-b.age);
  L.push(`最年少は <b>${aged[0].name}</b>（${aged[0].age}歳）、最年長は <b>${aged[aged.length-1].name}</b>（${aged[aged.length-1].age}歳）です。`);
  const mc=[...countBy(members,m=>m.bm)].sort((a,b)=>b[1]-a[1])[0];
  if(mc) L.push(`誕生月で最も多いのは <b>${mc[0]}月</b>（${mc[1]}人）です。`);
  const tc=[...countBy(members,m=>m.term)].sort((a,b)=>b[1]-a[1])[0];
  L.push(`加入人数が最も多い期は <b>${tc[0]}</b>（${tc[1]}人）です。`);
  return `<ul class="ins">${L.map(t=>`<li>${t}</li>`).join('')}</ul>`;
}
function stats(){
  const ages=members.filter(m=>m.age!=null);
  const minA=Math.min(...ages.map(m=>m.age)), maxA=Math.max(...ages.map(m=>m.age));
  const ageItems=[]; for(let a=minA;a<=maxA;a++) ageItems.push({label:String(a),value:ages.filter(m=>m.age===a).length});
  const BIN=20000, maxR=Math.max(...members.map(m=>m.rating||0));
  const rItems=[]; for(let s=0;s<=maxR;s+=BIN) rItems.push({label:`${s/10000}万`,value:members.filter(m=>m.rating!=null&&m.rating>=s&&m.rating<s+BIN).length});
  const iqItems=[]; { const vs=members.map(m=>m.iq).filter(v=>v!=null); const lo=Math.floor(Math.min(...vs)/10)*10, hi=Math.max(...vs);
    for(let s=lo;s<=hi;s+=10) iqItems.push({label:String(s),value:vs.filter(v=>v>=s&&v<s+10).length}); }
  const avgStats = STATS.map((s,i)=>({label:s,value:Math.round(avg(members.map(m=>m.stats[i])))}));
  const metricOpts = sel => Object.keys(METRICS).map(k=>`<option${k===sel?' selected':''}>${k}</option>`).join('');
  const hasBody = members.filter(m=>m.height&&m.weight).length;
  $('#view').innerHTML = `
    <h2 class="sec">データから読み取れること</h2>
    <div class="panel">${insights()}</div>
    <h2 class="sec">分布</h2>
    <div class="panels">
      <div class="panel"><h3>年齢の分布</h3>${columns(ageItems)}</div>
      <div class="panel"><h3>評価値の分布（2万刻み）</h3>${columns(rItems)}</div>
      <div class="panel"><h3>IQの分布（10刻み）</h3>${columns(iqItems)}</div>
      <div class="panel"><h3>全体の平均能力値</h3>${hbars(avgStats,{max:STAT_MAX})}</div>
    </div>
    <h2 class="sec">グループ別の比較</h2>
    <div class="controls"><span class="note">グループの切り替え</span>
      <select class="sm" id="gdim">${['出所','世界','期'].map(d=>`<option${d===S.gdim?' selected':''}>${d}</option>`).join('')}</select></div>
    <div class="panels" style="grid-template-columns:1fr"><div class="panel"><h3>平均評価値</h3><div id="gbars"></div></div>
    <div class="panel"><h3>平均値の一覧（色が濃いほど高い）</h3><div id="gtable"></div></div></div>
    <h2 class="sec">2項目の関係（散布図）</h2>
    <div class="controls"><span class="note">横軸</span><select class="sm" id="sx">${metricOpts(S.sx)}</select><span class="note">縦軸</span><select class="sm" id="sy">${metricOpts(S.sy)}</select></div>
    <div class="panel" id="scat"></div>
    <div class="note" style="margin-top:6px">身長・体重・BMIは入力のある${hasBody}人のみが対象です。</div>`;
  const redrawG = () => { const g=groupTable(S.gdim); $('#gbars').innerHTML=g.bars; $('#gtable').innerHTML=g.table; };
  const redrawS = () => { $('#scat').innerHTML=scatterSVG(S.sx,S.sy); };
  $('#gdim').onchange=e=>{S.gdim=e.target.value;redrawG();};
  $('#sx').onchange=e=>{S.sx=e.target.value;redrawS();};
  $('#sy').onchange=e=>{S.sy=e.target.value;redrawS();};
  redrawG(); redrawS();
}

/* =============== ルーティング =============== */
const VIEWS = {home, zukan, birthday, stats};
function route(){
  clearInterval(HERO_T);
  const k = (location.hash||'#home').slice(1);
  const v = VIEWS[k] ? k : 'home';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.v===v));
  VIEWS[v]();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e=>{
  const ph = e.target.closest && e.target.closest('.dhead .photo img');
  if(ph){ $('#lbimg').src=ph.src; $('#lb').showModal(); return; }
  const t = e.target.closest('[data-no]');
  if(t && byNo[t.dataset.no]) openDetail(byNo[t.dataset.no]);
});
$('#dclose').onclick = () => $('#dlg').close();
$('#lb').addEventListener('click', () => $('#lb').close());
$('#dlg').addEventListener('click', e => { if(e.target.id==='dlg') e.target.close(); });

(async function(){
  try{
    const res = await fetch(CSV_FILE);
    if(!res.ok) throw new Error(res.status);
    members = buildMembers(parseCSV(await res.text()));
    members.forEach(m=>byNo[m.no]=m);
    route();
  }catch(e){
    $('#view').innerHTML = '<div class="msg">データファイルを読み込めませんでした。<br>index.html と同じ場所にCSVを置き、GitHub Pagesやローカルサーバー経由で開いてください（ファイルを直接開くと読み込めません）。</div>';
  }
})();
